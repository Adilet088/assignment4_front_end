<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a Table</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
</head>
<body>
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-6">
        <!-- Изменили h2 на h1 -->
        <h1 class="mb-4">Reserve a table</h1>

        <form action="#" method="post">
          <div class="mb-3">
            <label for="name" class="form-label">Your name</label>
            <input
              type="text"
              class="form-control"
              id="name"
              name="name"
              required
            >
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input
              type="email"
              class="form-control"
              id="email"
              name="email"
              required
            >
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input
              type="tel"
              class="form-control"
              id="phone"
              name="phone"
              required
            >
          </div>

          <div class="mb-3">
            <label for="guests" class="form-label">Guests</label>
            <input
              type="number"
              class="form-control"
              id="guests"
              name="guests"
              min="1"
              max="20"
              required
            >
          </div>

          <div class="mb-3">
            <label for="date" class="form-label">Date</label>
            <input
              type="date"
              class="form-control"
              id="date"
              name="date"
              required
            >
          </div>

          <fieldset class="mb-3">
            <legend class="fs-6">Seating</legend>

            <div class="form-check">
              <input
                type="radio"
                class="form-check-input"
                name="seating"
                id="inside"
                value="inside"
                required
              >
              <label class="form-check-label" for="inside">
                Inside
              </label>
            </div>

            <div class="form-check">
              <input
                type="radio"
                class="form-check-input"
                name="seating"
                id="terrace"
                value="terrace"
              >
              <label class="form-check-label" for="terrace">
                Terrace
              </label>
            </div>
          </fieldset>

          <div class="mb-3">
            <label for="meal-time" class="form-label">Meal time</label>
            <select
              class="form-select"
              id="meal-time"
              name="meal-time"
              required
            >
              <option value="">Choose a time</option>
              <option value="lunch">Lunch</option>
              <option value="dinner">Dinner</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="comments" class="form-label">Comments</label>
            <textarea
              class="form-control"
              id="comments"
              name="comments"
              rows="3"
            ></textarea>
          </div>

          <div class="form-check mb-3">
            <input
              type="checkbox"
              class="form-check-input"
              id="terms"
              name="terms"
              value="agreed"
              required
            >
            <label class="form-check-label" for="terms">
              I agree to the terms
            </label>
          </div>

          <button type="submit" class="btn btn-primary">
            Reserve
          </button>
        </form>
      </div>
    </div>
  </main>
</body>
</html>
