
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book a Train Ticket</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Montserrat font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <!-- Our CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-4 py-lg-5">
        <div class="booking-card mx-auto">

            <header class="booking-header">
                <h1>Book a train ticket</h1>
            </header>

            <form class="booking-form" action="#" method="get">

                <!-- Trip type -->
                <fieldset class="mb-4">
                    <legend class="visually-hidden">Trip type</legend>

                    <div class="trip-options">
                        <input
                            type="radio"
                            class="btn-check"
                            name="trip"
                            id="one-way"
                            value="one-way"
                            checked
                        >
                        <label class="btn trip-btn" for="one-way">
                            One way
                        </label>

                        <input
                            type="radio"
                            class="btn-check"
                            name="trip"
                            id="round-trip"
                            value="round-trip"
                        >
                        <label class="btn trip-btn" for="round-trip">
                            Round trip
                        </label>
                    </div>
                </fieldset>

                <!-- From and To -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="from" class="visually-hidden">
                            From
                        </label>
                        <input
                            type="text"
                            class="form-control location-input"
                            id="from"
                            name="from"
                            placeholder="From — Astana"
                            aria-label="From"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="to" class="visually-hidden">
                            To
                        </label>
                        <input
                            type="text"
                            class="form-control location-input"
                            id="to"
                            name="to"
                            placeholder="To — Almaty"
                            aria-label="To"
                            required
                        >
                    </div>
                </div>

                <!-- Dates and passengers -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-4">
                        <label for="departure" class="form-label">
                            Departure
                        </label>
                        <input
                            type="date"
                            class="form-control"
                            id="departure"
                            name="departure"
                            required
                        >
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="return" class="form-label">
                            Return
                        </label>
                        <input
                            type="date"
                            class="form-control"
                            id="return"
                            name="return"
                        >
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="passengers" class="form-label">
                            Passengers
                        </label>
                        <select
                            class="form-select"
                            id="passengers"
                            name="passengers"
                        >
                            <option value="1" selected>1 adult</option>
                            <option value="2">2 adults</option>
                            <option value="3">3 adults</option>
                            <option value="4">4 adults</option>
                            <option value="5">5 adults</option>
                            <option value="6">6 adults</option>
                        </select>
                    </div>
                </div>

                <!-- Carriage class -->
                <fieldset class="mb-4">
                    <legend class="form-label">Carriage class</legend>

                    <div class="class-options">
                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="carriage"
                                id="seat"
                                value="seat"
                                required
                            >
                            <label class="form-check-label" for="seat">
                                Seat
                            </label>
                        </div>

                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="carriage"
                                id="coupe"
                                value="coupe"
                            >
                            <label class="form-check-label" for="coupe">
                                Coupé
                            </label>
                        </div>

                        <div class="form-check">
                            <input
                                class="form-check-input"
                                type="radio"
                                name="carriage"
                                id="sleeper"
                                value="sleeper"
                            >
                            <label class="form-check-label" for="sleeper">
                                Sleeper
                            </label>
                        </div>
                    </div>
                </fieldset>

                <!-- Phone and email -->
                <div class="row g-3 mb-3">
                    <div class="col-12 col-md-6">
                        <label for="phone" class="form-label">
                            Phone
                        </label>

                        <div class="input-group">
                            <span class="input-group-text country-code">
                                +7
                            </span>
                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                name="phone"
                                placeholder="701 234 56 78"
                                autocomplete="tel-national"
                                required
                            >
                        </div>
                    </div>

                    <div class="col-12 col-md-6">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="name@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>
                </div>

                <!-- Optional SMS -->
                <div class="form-check form-switch mb-2">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        role="switch"
                        id="sms"
                        name="sms"
                        value="yes"
                    >
                    <label class="form-check-label" for="sms">
                        Also send the ticket by SMS
                    </label>
                </div>

                <!-- Required agreement -->
                <div class="form-check mb-4">
                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="agreement"
                        name="agreement"
                        value="yes"
                        required
                    >
                    <label class="form-check-label" for="agreement">
                        I agree with the carriage rules
                    </label>
                </div>

                <!-- Buttons -->
                <div class="form-actions">
                    <button
                        type="reset"
                        class="btn clear-btn"
                    >
                        Clear
                    </button>

                    <button
                        type="submit"
                        class="btn find-btn"
                    >
                        Find trains
                    </button>
                </div>

            </form>
        </div>
    </main>
</body>
</html>
